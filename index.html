<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB Works</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 100px 25px;
        }

        h1 {
            font-size: 60px;

        }

        p {

            color: #aaa;
            line-height: 1.6;
        }

        .projects {
            margin-top: 60px;
        }

        .project {
            padding: 25px 0;
            border-top: 1px solid #333;
        }
    </style>
</head>

<body>

    <main>
        <h1>HB Works</h1>

        <p>
            Hi, I'm Harry. This is my portfolio.
        </p>

        <section class="projects">
            <h2>Projects</h2>

            <div class="project">
                <h3>Project One</h3>
                <p>Something I've built.</p>
            </div>

            <div class="project">
                <h3>Project Two</h3>
                <p>Another project I'm working on.</p>
            </div>
        </section>

</body>
</html>
