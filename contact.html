<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | HB Works</title>
    <meta name="description" content="Get in touch with HB Works for photographic inquiries and collaborations.">
    
    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2309090b'/><rect x='13' y='13' width='74' height='74' fill='none' stroke='%23f4f4f5' stroke-width='5'/><text x='50%' y='64%' font-family='monospace' font-weight='bold' font-size='34' fill='%23f4f4f5' text-anchor='middle'>HB</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        zinc: {
                            950: '#09090b',
                            900: '#18181b',
                            800: '#27272a',
                            700: '#3f3f46',
                            400: '#a1a1aa',
                            300: '#d4d4d8',
                            100: '#f4f4f5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        * { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col border-t-2 border-zinc-100 selection:bg-zinc-100 selection:text-zinc-950">

    <header class="w-full border-b border-zinc-800 px-6 py-4 relative z-50 bg-zinc-950">
        <nav class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="/" class="font-bold text-sm tracking-normal uppercase text-zinc-100 hover:text-zinc-400 transition-colors">
                HB Works
            </a>
            
            <a href="/pages" class="p-2 border border-zinc-800 hover:border-zinc-600 transition-colors flex items-center gap-2 text-xs font-mono text-zinc-300 uppercase tracking-widest" aria-label="Open navigation index">
                <span>Menu</span>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </a>
        </nav>
    </header>

    <main class="flex-grow flex flex-col justify-center py-12 sm:py-24 px-4 sm:px-6 max-w-5xl mx-auto w-full">
        <div class="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-3 sm:mb-4">
            Contact
        </div>
        
        <h1 class="text-lg sm:text-3xl md:text-4xl font-bold tracking-tight text-zinc-100 mb-6 sm:mb-8 leading-tight font-mono break-all">
            hbworksuk@proton.me
        </h1>

        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 items-stretch sm:items-center">
            <a href="mailto:hbworksuk@proton.me" class="text-center border border-zinc-100 bg-zinc-100 text-zinc-950 px-5 py-3 text-xs font-mono font-semibold uppercase tracking-wider hover:bg-zinc-300 hover:border-zinc-300 transition-colors active:bg-zinc-300">
                Send Email
            </a>
            <button onclick="copyEmail()" class="text-center border border-zinc-800 text-zinc-300 hover:border-zinc-600 px-5 py-3 text-xs font-mono transition-colors active:bg-zinc-900">
                <span id="copy-email-text">Copy Address</span>
            </button>
        </div>
    </main>

    <footer class="py-6 px-6 border-t border-zinc-800 text-xs font-mono text-zinc-500 text-center">
        <p>&copy; HB Works (hbworks.uk)</p>
    </footer>

    <script>
        function copyEmail() {
            const email = "hbworksuk@proton.me";
            const textarea = document.createElement("textarea");
            textarea.value = email;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const label = document.getElementById("copy-email-text");
            label.innerText = "COPIED TO CLIPBOARD";
            setTimeout(() => { label.innerText = "Copy Address"; }, 2000);
        }
    </script>
</body>
</html>
